server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: resq-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hazard_db}
    username: ${DB_USERNAME:apple}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: HazardHikariCP
      auto-commit: true

  jpa:
    hibernate:
      # Strictly preserve existing PostGIS tables and schemas created in Stage 2.4
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

logging:
  level:
    root: INFO
    com.hazard: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
